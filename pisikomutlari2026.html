<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pisi Linux Komutları · 2026</title>
    <style>
        /* ----- Reset & Fonts ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b0f14;
            color: #e6edf3;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1360px;
            width: 100%;
        }

        /* ----- Header (deniz mavisi → turkuaz gradient) ----- */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.8rem;
            border-bottom: 2px solid #21262d;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, #00b4d8, #2a9d8f);
            border-radius: 4px;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00b4d8, #2a9d8f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }

        .header h1 span {
            font-size: 2.2rem;
            -webkit-text-fill-color: #8b949e;
            background: none;
        }

        .header .sub {
            color: #8b949e;
            font-size: 1.1rem;
            margin-top: 0.6rem;
            letter-spacing: 0.3px;
        }

        .header .sub a {
            color: #58a6ff;
            text-decoration: none;
            border-bottom: 1px dashed #58a6ff60;
            transition: border-color 0.2s;
        }

        .header .sub a:hover {
            border-bottom-color: #58a6ff;
        }

        /* ----- Toolbar (Arama + Filtre) ----- */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2.5rem;
            justify-content: center;
        }

        .search-box {
            flex: 1 1 320px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 40px;
            padding: 0.6rem 1.8rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .search-box:focus-within {
            border-color: #00b4d8;
            box-shadow: 0 0 0 4px #00b4d825;
        }

        .search-box svg {
            flex-shrink: 0;
            color: #8b949e;
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #e6edf3;
            font-size: 1rem;
            width: 100%;
            padding: 0.3rem 0;
            font-family: inherit;
        }

        .search-box input::placeholder {
            color: #484f58;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-btn {
            background: transparent;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: inherit;
        }

        .filter-btn:hover {
            border-color: #00b4d860;
            color: #e6edf3;
        }

        .filter-btn.active {
            background: #00b4d820;
            border-color: #00b4d8;
            color: #00b4d8;
            box-shadow: 0 0 12px #00b4d820;
        }

        /* ----- Kategori Başlıkları (mavi sol kenar) ----- */
        .category-headline {
            grid-column: 1 / -1;
            margin: 1.8rem 0 0.6rem 0;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: #161b22;
            border-left: 6px solid #00b4d8;
            border-bottom: 1px solid #21262d;
        }

        .category-headline .badge {
            font-size: 0.7rem;
            background: #21262d;
            padding: 0.1rem 0.7rem;
            border-radius: 30px;
            color: #8b949e;
            font-weight: 400;
        }

        .category-headline .cat-icon {
            font-size: 1.5rem;
        }

        /* ----- Command Grid ----- */
        .commands-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }

        /* ----- Command Card (mavi sol çizgi & hover) ----- */
        .cmd-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 1.25rem 1.5rem 1.4rem;
            transition: transform 0.18s ease, border-color 0.25s, box-shadow 0.25s;
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            position: relative;
            overflow: visible; /* feedback taşmasına izin ver */
        }

        .cmd-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: #00b4d8;
            opacity: 0.3;
            transition: opacity 0.3s;
        }

        .cmd-card:hover {
            transform: translateY(-4px);
            border-color: #00b4d880;
            box-shadow: 0 12px 30px -8px #000000cc;
        }

        .cmd-card:hover::before {
            opacity: 1;
        }

        .cmd-card .cmd-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            position: relative;
        }

        .cmd-card .cmd-name {
            font-size: 1.15rem;
            font-weight: 600;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            color: #00b4d8;
            background: #0d1117;
            padding: 0.1rem 0.7rem;
            border-radius: 8px;
            border: 1px solid #30363d;
            letter-spacing: -0.2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 80%;
        }

        .cmd-card .cmd-copy {
            background: transparent;
            border: none;
            color: #8b949e;
            cursor: pointer;
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.85rem;
            flex-shrink: 0;
            position: relative;
        }

        .cmd-card .cmd-copy:hover {
            background: #30363d;
            color: #e6edf3;
        }

        .cmd-card .cmd-copy:active {
            transform: scale(0.92);
        }

        .cmd-card .cmd-copy .copy-feedback {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(100% + 8px); /* butonun hemen üstünde değil, altında */
            background: #238636;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 0.2rem 0.7rem;
            border-radius: 6px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            white-space: nowrap;
            box-shadow: 0 4px 12px #00000060;
            z-index: 10;
        }

        .cmd-card .cmd-copy .copy-feedback.show {
            opacity: 1;
        }

        .cmd-card .cmd-desc {
            color: #b1bac4;
            font-size: 0.95rem;
            line-height: 1.5;
            border-left: 2px solid #30363d;
            padding-left: 0.8rem;
            margin-top: 0.1rem;
        }

        .cmd-card .cmd-example {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            background: #0d1117;
            padding: 0.25rem 0.7rem;
            border-radius: 6px;
            color: #8b949e;
            border: 1px solid #21262d;
            display: inline-block;
            max-width: 100%;
            overflow-x: auto;
            white-space: nowrap;
        }

        .cmd-card .cmd-category-tag {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b949e;
            background: #21262d;
            padding: 0.1rem 0.7rem;
            border-radius: 30px;
            align-self: flex-start;
            border: 1px solid #30363d;
        }

        /* Kategori tag renkleri (mavi tonları) */
        .cmd-card[data-category="paket yönetimi"] .cmd-category-tag {
            border-color: #00b4d860;
            color: #00b4d8;
        }
        .cmd-card[data-category="depo yönetimi"] .cmd-category-tag {
            border-color: #58a6ff60;
            color: #58a6ff;
        }
        .cmd-card[data-category="geliştirme"] .cmd-category-tag {
            border-color: #7ee78760;
            color: #7ee787;
        }
        .cmd-card[data-category="sistem"] .cmd-category-tag {
            border-color: #d2a8ff60;
            color: #d2a8ff;
        }
        .cmd-card[data-category="ağ / paylaşım"] .cmd-category-tag {
            border-color: #ffa65760;
            color: #ffa657;
        }
        .cmd-card[data-category="yardımcı"] .cmd-category-tag {
            border-color: #f5a62360;
            color: #f5a623;
        }

        /* ----- Footer ----- */
        .footer {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid #30363d;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            color: #8b949e;
            font-size: 0.9rem;
        }

        .footer .sources {
            display: flex;
            gap: 1.8rem;
            flex-wrap: wrap;
        }

        .footer .sources a {
            color: #58a6ff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s, color 0.2s;
        }

        .footer .sources a:hover {
            border-bottom-color: #58a6ff;
            color: #79c0ff;
        }

        .footer .copy-badge {
            background: #21262d;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            border: 1px solid #30363d;
            font-size: 0.8rem;
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* ----- Responsive ----- */
        @media (max-width: 760px) {
            .header h1 {
                font-size: 2.4rem;
            }
            .commands-grid {
                grid-template-columns: 1fr;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .search-box {
                flex: 1 1 auto;
            }
            .filter-group {
                justify-content: center;
            }
            .footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem 0.8rem;
            }
            .header h1 {
                font-size: 2rem;
            }
            .cmd-card .cmd-name {
                font-size: 1rem;
                max-width: 70%;
            }
        }

        /* ----- Scrollbar ----- */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1117;
        }
        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        /* ----- Kart gizleme (filtre) ----- */
        .cmd-card {
            transition: opacity 0.2s, transform 0.2s, border-color 0.25s, box-shadow 0.25s;
        }
        .cmd-card.hidden {
            display: none;
        }

        .cmd-card .cmd-example::-webkit-scrollbar {
            height: 3px;
        }
        .cmd-card .cmd-example::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 10px;
        }

        /* W3C uyumlu görsel gizleme (sadece ekran okuyucular için) */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- HEADER -->
        <header class="header">
            <h1>
                <span role="img" aria-label="Penguen">🐧</span>
                Pisi Linux
                <span>·</span>
                <span aria-hidden="true">2026</span>
                <span class="visually-hidden">2026</span>
            </h1>
            <div class="sub">
                Tam komut listesi · 
                <a href="#" onclick="event.preventDefault(); document.getElementById('searchInput').focus();" aria-label="Arama kutusuna odaklan">
                    arama yap
                </a>
                &nbsp;·&nbsp; <span id="resultCount">0</span> komut
            </div>
        </header>

        <!-- TOOLBAR -->
        <div class="toolbar">
            <div class="search-box" role="search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Ara">
                    <circle cx="11" cy="11" r="8" />
                    <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" id="searchInput" placeholder="Komut, açıklama veya örnek ara…" autocomplete="off" aria-label="Komut arama" />
            </div>
            <div class="filter-group" id="filterGroup" role="group" aria-label="Kategori filtreleri">
                <button class="filter-btn active" data-filter="all" aria-pressed="true">Tümü</button>
                <button class="filter-btn" data-filter="paket yönetimi" aria-pressed="false">
                    <span role="img" aria-label="Paket">📦</span> Paket
                </button>
                <button class="filter-btn" data-filter="depo yönetimi" aria-pressed="false">
                    <span role="img" aria-label="Depo">📂</span> Depo
                </button>
                <button class="filter-btn" data-filter="geliştirme" aria-pressed="false">
                    <span role="img" aria-label="Geliştirme">🛠</span> Geliştirme
                </button>
                <button class="filter-btn" data-filter="sistem" aria-pressed="false">
                    <span role="img" aria-label="Sistem">⚙️</span> Sistem
                </button>
                <button class="filter-btn" data-filter="ağ / paylaşım" aria-pressed="false">
                    <span role="img" aria-label="Ağ">🌐</span> Ağ
                </button>
                <button class="filter-btn" data-filter="yardımcı" aria-pressed="false">
                    <span role="img" aria-label="Yardımcı">🧰</span> Yardımcı
                </button>
            </div>
        </div>

        <!-- COMMANDS GRID -->
        <div class="commands-grid" id="commandsGrid" role="list">
            <!-- JS ile doldurulacak -->
        </div>

        <!-- FOOTER -->
        <footer class="footer">
            <div class="sources">
                <a href="https://pisilinux.org" target="_blank" rel="noopener">
                    <span role="img" aria-label="Web sitesi">🌐</span> pisilinux.org
                </a>
                <a href="https://wiki.pisilinux.org" target="_blank" rel="noopener">
                    <span role="img" aria-label="Wiki">📖</span> Wiki
                </a>
                <a href="https://github.com/pisilinux" target="_blank" rel="noopener">
                    <span role="img" aria-label="GitHub">🐙</span> GitHub
                </a>
                <a href="https://pisilinux.org/docs" target="_blank" rel="noopener">
                    <span role="img" aria-label="Dokümantasyon">📄</span> Doküman
                </a>
                <a href="https://forum.pisilinux.org" target="_blank" rel="noopener">
                    <span role="img" aria-label="Forum">💬</span> Forum
                </a>
            </div>
            <div class="copy-badge">
                <span role="img" aria-label="Kopyala">⏎</span> tıkla · kopyala
            </div>
        </footer>
    </div>

    <script>
        // ----- GENİŞLETİLMİŞ KOMUT LİSTESİ (tüm Pisi komutları) -----
        const commands = [
            // ========== PAKET YÖNETİMİ ==========
            { cmd: 'pisi install <paket>', desc: 'Belirtilen paketi kurar.', category: 'paket yönetimi', example: 'pisi install firefox' },
            { cmd: 'pisi remove <paket>', desc: 'Kurulu paketi kaldırır.', category: 'paket yönetimi', example: 'pisi remove firefox' },
            { cmd: 'pisi update', desc: 'Depo indeksini günceller.', category: 'paket yönetimi', example: 'pisi update' },
            { cmd: 'pisi upgrade', desc: 'Tüm sistemi günceller (yükseltir).', category: 'paket yönetimi', example: 'pisi upgrade' },
            { cmd: 'pisi search <terim>', desc: 'Depoda paket arar.', category: 'paket yönetimi', example: 'pisi search python' },
            { cmd: 'pisi info <paket>', desc: 'Paket hakkında ayrıntılı bilgi gösterir.', category: 'paket yönetimi', example: 'pisi info firefox' },
            { cmd: 'pisi list', desc: 'Kurulu paketleri listeler.', category: 'paket yönetimi', example: 'pisi list' },
            { cmd: 'pisi list-available', desc: 'Depodaki tüm paketleri listeler.', category: 'paket yönetimi', example: 'pisi list-available' },
            { cmd: 'pisi list-upgrades', desc: 'Yükseltilebilir paketleri gösterir.', category: 'paket yönetimi', example: 'pisi list-upgrades' },
            { cmd: 'pisi list-files <paket>', desc: 'Paketin içindeki dosyaları listeler.', category: 'paket yönetimi', example: 'pisi list-files firefox' },
            { cmd: 'pisi verify <paket>', desc: 'Paket bütünlüğünü doğrular.', category: 'paket yönetimi', example: 'pisi verify firefox' },
            { cmd: 'pisi clean', desc: 'Geçici paket dosyalarını temizler.', category: 'paket yönetimi', example: 'pisi clean' },
            { cmd: 'pisi reinstall <paket>', desc: 'Paketi yeniden kurar (onarır).', category: 'paket yönetimi', example: 'pisi reinstall firefox' },
            { cmd: 'pisi lock <paket>', desc: 'Paketi güncellemelerden korur.', category: 'paket yönetimi', example: 'pisi lock firefox' },
            { cmd: 'pisi unlock <paket>', desc: 'Paket kilidini kaldırır.', category: 'paket yönetimi', example: 'pisi unlock firefox' },
            { cmd: 'pisi dist-upgrade', desc: 'Tüm sistemi yeni sürüme yükseltir (dağıtım yükseltmesi).', category: 'paket yönetimi', example: 'pisi dist-upgrade' },

            // ========== DEPO YÖNETİMİ ==========
            { cmd: 'pisi add-repo <repo>', desc: 'Yeni bir depo ekler.', category: 'depo yönetimi', example: 'pisi add-repo contrib' },
            { cmd: 'pisi remove-repo <repo>', desc: 'Bir depoyu kaldırır.', category: 'depo yönetimi', example: 'pisi remove-repo contrib' },
            { cmd: 'pisi list-repo', desc: 'Mevcut depoları listeler.', category: 'depo yönetimi', example: 'pisi list-repo' },
            { cmd: 'pisi update-repo', desc: 'Tüm depoları günceller.', category: 'depo yönetimi', example: 'pisi update-repo' },
            { cmd: 'pisi enable-repo <repo>', desc: 'Bir depoyu etkinleştirir.', category: 'depo yönetimi', example: 'pisi enable-repo contrib' },
            { cmd: 'pisi disable-repo <repo>', desc: 'Bir depoyu devre dışı bırakır.', category: 'depo yönetimi', example: 'pisi disable-repo contrib' },

            // ========== GELİŞTİRME ==========
            { cmd: 'pisi build <pspec>', desc: 'Kaynak koddan paket derler (pspec.xml ile).', category: 'geliştirme', example: 'pisi build pspec.xml' },
            { cmd: 'pisi sign <dosya>', desc: 'Paketi imzalar.', category: 'geliştirme', example: 'pisi sign mypackage.pisi' },
            { cmd: 'pisi check', desc: 'Sistemdeki paket bağımlılıklarını kontrol eder.', category: 'geliştirme', example: 'pisi check' },
            { cmd: 'pisi compare <p1> <p2>', desc: 'İki paket arasında karşılaştırma yapar.', category: 'geliştirme', example: 'pisi compare firefox-1 firefox-2' },
            { cmd: 'pisi create', desc: 'Yeni bir pspec dosyası oluşturur.', category: 'geliştirme', example: 'pisi create' },
            { cmd: 'pisi prepare', desc: 'Paket derleme ortamını hazırlar.', category: 'geliştirme', example: 'pisi prepare' },
            { cmd: 'pisi install-build-deps', desc: 'Derleme bağımlılıklarını kurar.', category: 'geliştirme', example: 'pisi install-build-deps' },

            // ========== SİSTEM ==========
            { cmd: 'pisi help', desc: 'Yardım mesajını gösterir.', category: 'sistem', example: 'pisi help' },
            { cmd: 'pisi version', desc: 'Pisi sürümünü gösterir.', category: 'sistem', example: 'pisi version' },
            { cmd: 'pisi history', desc: 'Paket geçmişini görüntüler.', category: 'sistem', example: 'pisi history' },
            { cmd: 'pisi serve', desc: 'Yerel depo sunucusu başlatır.', category: 'sistem', example: 'pisi serve' },
            { cmd: 'pisi clean-cache', desc: 'Önbelleği temizler.', category: 'sistem', example: 'pisi clean-cache' },
            { cmd: 'pisi self-upgrade', desc: 'Pisi’nin kendisini günceller.', category: 'sistem', example: 'pisi self-upgrade' },

            // ========== AĞ / PAYLAŞIM ==========
            { cmd: 'pisi share <dosya>', desc: 'Dosyayı ağ üzerinden paylaşır (PisiShare).', category: 'ağ / paylaşım', example: 'pisi share belge.pdf' },
            { cmd: 'pisi fetch <url>', desc: 'Belirtilen URL’den paket indirir.', category: 'ağ / paylaşım', example: 'pisi fetch https://depo.pisilinux.org/...' },
            { cmd: 'pisi download <paket>', desc: 'Paketi indirir (kurmaz).', category: 'ağ / paylaşım', example: 'pisi download firefox' },

            // ========== YARDIMCI (Ek araçlar) ==========
            { cmd: 'pisitools', desc: 'Pisi geliştirme araçları seti (genel).', category: 'yardımcı', example: 'pisitools --help' },
            { cmd: 'pisitools-common', desc: 'Pisi ortak yardımcı fonksiyonlar.', category: 'yardımcı', example: 'pisitools-common' },
            { cmd: 'pisitools-git', desc: 'Git entegrasyon araçları.', category: 'yardımcı', example: 'pisitools-git' },
        ];

        // ----- DOM refs -----
        const grid = document.getElementById('commandsGrid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const resultCountSpan = document.getElementById('resultCount');

        let currentFilter = 'all';
        let currentSearch = '';

        // ----- Kategori başlıkları ve ikonları -----
        const categoryMeta = {
            'paket yönetimi': { icon: '📦', label: 'Paket Yönetimi', ariaLabel: 'Paket Yönetimi' },
            'depo yönetimi': { icon: '📂', label: 'Depo Yönetimi', ariaLabel: 'Depo Yönetimi' },
            'geliştirme': { icon: '🛠', label: 'Geliştirme', ariaLabel: 'Geliştirme' },
            'sistem': { icon: '⚙️', label: 'Sistem', ariaLabel: 'Sistem' },
            'ağ / paylaşım': { icon: '🌐', label: 'Ağ & Paylaşım', ariaLabel: 'Ağ ve Paylaşım' },
            'yardımcı': { icon: '🧰', label: 'Yardımcı Araçlar', ariaLabel: 'Yardımcı Araçlar' },
        };

        // ----- Render -----
        function render() {
            const lowerSearch = currentSearch.toLowerCase().trim();

            const filtered = commands.filter(item => {
                if (currentFilter !== 'all' && item.category !== currentFilter) return false;
                if (lowerSearch) {
                    return item.cmd.toLowerCase().includes(lowerSearch) ||
                           item.desc.toLowerCase().includes(lowerSearch) ||
                           (item.example && item.example.toLowerCase().includes(lowerSearch)) ||
                           item.category.toLowerCase().includes(lowerSearch);
                }
                return true;
            });

            resultCountSpan.textContent = filtered.length;

            const categoryOrder = ['paket yönetimi', 'depo yönetimi', 'geliştirme', 'sistem', 'ağ / paylaşım', 'yardımcı'];
            const grouped = {};
            categoryOrder.forEach(cat => { grouped[cat] = []; });
            filtered.forEach(item => {
                if (grouped[item.category]) grouped[item.category].push(item);
            });

            let html = '';
            let anyVisible = false;

            for (const cat of categoryOrder) {
                const items = grouped[cat] || [];
                if (items.length === 0) continue;
                anyVisible = true;

                const meta = categoryMeta[cat] || { icon: '📌', label: cat, ariaLabel: cat };
                html += `
                    <div class="category-headline" data-category="${cat}" role="heading" aria-level="2">
                        <span class="cat-icon" role="img" aria-label="${meta.ariaLabel}">${meta.icon}</span>
                        ${meta.label}
                        <span class="badge" aria-label="${items.length} komut">${items.length}</span>
                    </div>
                `;

                items.forEach(item => {
                    const uid = 'cmd-' + Math.random().toString(36).substring(2, 8);
                    html += `
                        <div class="cmd-card" data-category="${item.category}" data-cmd="${item.cmd}" role="listitem">
                            <div class="cmd-header">
                                <span class="cmd-name">${item.cmd}</span>
                                <button class="cmd-copy" data-copy="${item.cmd}" data-feedback-id="${uid}" 
                                        aria-label="Komutu kopyala: ${item.cmd}" title="Komutu kopyala">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" 
                                         role="img" aria-label="Kopyala" focusable="false">
                                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                                    </svg>
                                    <span class="copy-feedback" id="${uid}" role="status" aria-live="polite">Kopyalandı!</span>
                                </button>
                            </div>
                            <div class="cmd-desc">${item.desc}</div>
                            ${item.example ? `<div class="cmd-example" aria-label="Örnek: ${item.example}">${item.example}</div>` : ''}
                            <span class="cmd-category-tag">${item.category}</span>
                        </div>
                    `;
                });
            }

            if (!anyVisible) {
                html = `
                    <div style="grid-column:1/-1; text-align:center; padding:4rem 1rem; color:#8b949e; border:1px dashed #30363d; border-radius:24px;" role="status" aria-live="polite">
                        <div style="font-size:3rem; margin-bottom:0.8rem;" role="img" aria-label="Arama sonucu yok">🔍</div>
                        <p style="font-size:1.2rem;">Sonuç bulunamadı</p>
                        <p style="font-size:0.9rem; color:#484f58;">Farklı bir arama veya filtre deneyin.</p>
                    </div>
                `;
            }

            grid.innerHTML = html;

            // ----- Kopyalama butonları -----
            document.querySelectorAll('.cmd-copy').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const cmd = this.getAttribute('data-copy');
                    const feedbackId = this.getAttribute('data-feedback-id');
                    const feedbackEl = document.getElementById(feedbackId);
                    if (!cmd) return;

                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(cmd).then(() => {
                            showFeedback(feedbackEl);
                        }).catch(() => {
                            fallbackCopy(cmd, feedbackEl);
                        });
                    } else {
                        fallbackCopy(cmd, feedbackEl);
                    }
                });
            });
        }

        function showFeedback(el) {
            if (!el) return;
            el.classList.add('show');
            clearTimeout(el._timeout);
            el._timeout = setTimeout(() => el.classList.remove('show'), 1800);
        }

        function fallbackCopy(text, feedbackEl) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            textarea.style.top = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showFeedback(feedbackEl);
            } catch (_) {}
            document.body.removeChild(textarea);
        }

        // ----- Filtre butonları (W3C uyumlu aria-pressed) -----
        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                filterBtns.forEach(b => {
                    b.classList.remove('active');
                    b.setAttribute('aria-pressed', 'false');
                });
                this.classList.add('active');
                this.setAttribute('aria-pressed', 'true');
                currentFilter = this.getAttribute('data-filter');
                render();
            });
        });

        // ----- Arama -----
        let searchTimeout = null;
        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                currentSearch = this.value;
                render();
            }, 150);
        });

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                this.value = '';
                currentSearch = '';
                render();
                this.blur();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
                e.preventDefault();
                searchInput.focus();
            }
        });

        // ----- İlk render -----
        render();
    </script>
</body>
</html>
